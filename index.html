<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
    color:#fff;
    background:#111;
}


/* =========================
   VIDEO BACKGROUND
========================= */

.bg-video{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-3;

    background:#111;
}


/* =========================
   VIDEO OVERLAY
========================= */

.video-overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.20),
            rgba(0,0,0,.28)
        );

    z-index:-2;

    pointer-events:none;
}


/* =========================
   PAGE
========================= */

.page{

    position:relative;

    width:100%;

    min-height:100vh;
    min-height:100svh;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px 20px;

    overflow:hidden;
}


/* =========================
   CENTER CONTENT
========================= */

.center{

    position:relative;

    width:min(500px,92vw);

    text-align:center;

    z-index:10;

    /* Tidak ada kotak */
    background:transparent;

    border:0;

    box-shadow:none;

    padding:20px;
}


/* =========================
   BRAND
========================= */

.brand{

    display:inline-flex;

    align-items:center;

    gap:4px;

    font-size:44px;

    font-weight:800;

    letter-spacing:-2px;

    color:#fff;

    margin-bottom:45px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.55);
}

.brand span{

    background:#e92d72;

    color:#fff;

    font-size:17px;

    line-height:1;

    padding:7px 9px 6px;

    border-radius:4px;

    letter-spacing:-.5px;

    margin-top:8px;

    text-shadow:none;
}


/* =========================
   HEADLINE
========================= */

h1{

    margin:0 auto 18px;

    max-width:480px;

    font-size:clamp(26px,3.5vw,38px);

    line-height:1.15;

    letter-spacing:-.7px;

    color:#fff;

    text-shadow:
        0 2px 12px rgba(0,0,0,.65),
        0 1px 3px rgba(0,0,0,.7);
}


/* =========================
   SUBTITLE
========================= */

.subtitle{

    margin:0 auto 28px;

    max-width:430px;

    color:#fff;

    font-size:17px;

    line-height:1.45;

    text-shadow:
        0 2px 10px rgba(0,0,0,.7);
}


/* =========================
   BUTTONS
========================= */

.buttons{

    display:grid;

    gap:12px;

    width:min(390px,100%);

    margin:auto;
}

.cta{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    min-height:58px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #c21855,
            #e01d68
        );

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:700;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.cta:hover{

    transform:translateY(-2px);

    box-shadow:
        0 14px 30px rgba(0,0,0,.30);
}

.cta .icon{

    font-size:24px;
}


/* =========================
   NOTE
========================= */

.note{

    margin:18px auto 0;

    max-width:370px;

    color:#fff;

    font-size:13px;

    line-height:1.5;

    text-shadow:
        0 2px 9px rgba(0,0,0,.7);
}


/* =========================
   MOBILE
========================= */

@media(max-width:560px){

    .page{

        padding:20px 12px;
    }

    .center{

        width:94vw;

        padding:15px;
    }

    .brand{

        font-size:36px;

        margin-bottom:32px;
    }

    .brand span{

        font-size:14px;

        padding:6px 7px;
    }

    h1{

        font-size:25px;

        line-height:1.18;
    }

    .subtitle{

        font-size:15px;

        margin-bottom:23px;
    }

    .cta{

        min-height:55px;

        font-size:17px;
    }

    .note{

        font-size:12px;

        margin-top:15px;
    }
}

</style>
